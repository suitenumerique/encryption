    image:
      repository: lasuite/accounts-frontend
      pullPolicy: Always
      tag: main
    envVars:
      PORT: 8080
      NEXT_PUBLIC_API_ORIGIN: https://accounts.suite.example.org
  ingress:
    enabled: true
    host: accounts.suite.example.org
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt
  ingressAdmin:
    enabled: true
    host: accounts.suite.example.org
  # An ExternalName Service, so it needs the fully qualified name of the shared MinIO.
  serviceMedia:
    host: minio.suite.svc.cluster.local
    port: 9000
  posthog:
    ingress:
      enabled: false
    ingressAssets:
      enabled: false
