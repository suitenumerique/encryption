      # Its own sign-in, at the shared Keycloak's realm with the client
      # bootstrap.keycloak.clients[accounts]. The `acr_values=eidas1` it sends by default
      # (ProConnect's level) is unknown to the realm, which ignores it.
      SOCIAL_AUTH_ALLOWED_REDIRECT_HOSTS: accounts.suite.example.org
      SOCIAL_AUTH_PRO_CONNECT_KEY: accounts
      SOCIAL_AUTH_PRO_CONNECT_SECRET: ThisIsAnExampleKeyForDevPurposeOnly
      SOCIAL_AUTH_PRO_CONNECT_OIDC_ENDPOINT: https://auth.suite.example.org/realms/suite
      ENCRYPTION_FEATURE_ENABLED: 'True'
      ENCRYPTION_VAULT_URL: https://data.encryption.suite.example.org
      ENCRYPTION_INTERFACE_URL: https://encryption.suite.example.org
    # Not hooks, like the products' Jobs: they wait for the database themselves.
    migrate:
      command:
        - /bin/sh
        - -c
        - |
          while ! python manage.py check --database default > /dev/null 2>&1
          do
            echo "Database not ready"
            sleep 2
          done
          echo "Database is ready"
          python manage.py migrate --no-input
      restartPolicy: Never
    createsuperuser:
      command:
        - /bin/sh
        - -c
        - |
          while ! python manage.py check --database default > /dev/null 2>&1
          do
            echo "Database not ready"
            sleep 2
          done
          python manage.py createsuperuser --email "$DJANGO_SUPERUSER_EMAIL" --password "$DJANGO_SUPERUSER_PASSWORD"
      restartPolicy: Never
  frontend:
