{{- if .Values.accounts.enabled }}
{{- $fullName := include "suite-stack.fullname" . }}
{{- $hookName := printf "%s-accounts-applications-%d" $fullName .Release.Revision }}
{{- $b := .Values.bootstrap }}
{{/*
The OAuth2 applications Docs, Drive and the encryption service sign in to Accounts with.
Accounts has no command to declare them, so this Job writes them through its own models,
with its own image and settings, once its migration has run. It is a hook of the phases
AFTER the release's objects exist (post-install, post-upgrade), unlike the bootstrap:
Accounts' migration Job is an ordinary object, so on an upgrade it only starts once the
pre-upgrade hooks are done, and a wait for it there would never end. Idempotent, by
client id: the secret and the URIs are written again at every run.

The same Job writes the testers that carry an `id` (bootstrap.keycloak.users) with that
`sub`, by email, before their first sign-in: Accounts then attaches their Keycloak
sign-in to that user (`associate_by_email` in its pipeline) instead of drawing a `sub`.
*/}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $hookName | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "suite-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: accounts-applications
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
type: Opaque
stringData:
  applications.json: {{ $b.accounts.applications | toJson | quote }}
  {{- $fixed := list }}
  {{- range $b.keycloak.users }}
  {{- if .id }}{{ $fixed = append $fixed (dict "email" .email "sub" .id) }}{{ end }}
  {{- end }}
  users.json: {{ $fixed | toJson | quote }}
  # Run by `manage.py shell`, so with Accounts' settings and its database.
  applications.py: |
    import json

    from oauth2_provider.models import get_application_model

    Application = get_application_model()

    with open("/scripts/applications.json", encoding="utf-8") as file:
        specs = json.load(file)

    for spec in specs:
        application = Application.objects.filter(client_id=spec["clientId"]).first()
        created = application is None
        if created:
            application = Application(client_id=spec["clientId"])
        application.name = spec["clientId"]
        application.client_type = Application.CLIENT_CONFIDENTIAL
        application.authorization_grant_type = Application.GRANT_AUTHORIZATION_CODE
        # Stored hashed, like any secret typed in the admin.
        application.client_secret = spec["secret"]
        application.hash_client_secret = True
        application.redirect_uris = " ".join(spec["redirectUris"])
        application.post_logout_redirect_uris = " ".join(spec.get("postLogoutRedirectUris") or [])
        application.algorithm = Application.RS256_ALGORITHM
        application.skip_authorization = True
        application.clean()
        application.save()
        print(("created" if created else "updated") + " application " + spec["clientId"])

    from django.contrib.auth import get_user_model

    User = get_user_model()

    with open("/scripts/users.json", encoding="utf-8") as file:
        users = json.load(file)

    for spec in users:
        user = User.objects.filter(email__iexact=spec["email"]).first()
        if user is None:
            User.objects.create_user(email=spec["email"], sub=spec["sub"])
            print("created user " + spec["email"])
        elif user.sub != spec["sub"]:
            user.sub = spec["sub"]
            user.save(update_fields=["sub"])
            print("fixed the sub of user " + spec["email"])
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $hookName | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "suite-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: accounts-applications
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: {{ $b.job.backoffLimit }}
  activeDeadlineSeconds: {{ $b.job.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "suite-stack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: accounts-applications
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: applications
          image: {{ include "suite-stack.accountsImage" . | quote }}
          imagePullPolicy: {{ .Values.accounts.image.pullPolicy | default "IfNotPresent" }}
          command:
            - /bin/sh
            - -c
            - |
              # The last line says why: a pending migration, or a database or settings error.
              until out="$(python manage.py migrate --check 2>&1)"; do
                echo "waiting for Accounts' migration: $(printf '%s' "$out" | tail -n 1)"; sleep 3
              done
              python manage.py shell --command "exec(open('/scripts/applications.py').read())"
          # The same environment as the Accounts backend Deployment: backend.envVars then
          # backend.django.envVars, and both envFrom lists, so settings an operator moved
          # into a Secret reach this Job too.
          {{- $backend := .Values.accounts.backend }}
          {{- $django := $backend.django | default dict }}
          env:
            - name: HOME
              value: /tmp
            {{- range $vars := list ($backend.envVars | default dict) ($django.envVars | default dict) }}
            {{- range $name, $value := $vars }}
            - name: {{ $name | quote }}
              {{- if kindIs "map" $value }}
              valueFrom:
                {{- toYaml $value | nindent 16 }}
              {{- else }}
              value: {{ $value | quote }}
              {{- end }}
            {{- end }}
            {{- end }}
          {{- $envFrom := concat ($backend.envFrom | default list) ($django.envFrom | default list) }}
          {{- with $envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          secret:
            secretName: {{ $hookName | quote }}
            defaultMode: 0444
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
{{- end }}
