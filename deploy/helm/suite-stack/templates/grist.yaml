{{- /*
Grist: one container, no chart of its own to depend on. Everything it keeps lives in the
shared services (its home database in PostgreSQL, its documents in MinIO, its sessions
and notifications in Redis), so the pod itself keeps nothing: /persist only caches the
documents open on it, and a restart loses nothing.
*/}}
{{- if .Values.grist.enabled }}
{{- $g := .Values.grist }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grist
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "suite-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: grist
spec:
  # One server: Grist assigns each open document to one worker through Redis, which a
  # second replica would take part in only with a load balancer that knows it.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "suite-stack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grist
  template:
    metadata:
      labels:
        {{- include "suite-stack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: grist
    spec:
      automountServiceAccountToken: false
      # The image's entrypoint starts as root to chown /persist and drop to its `grist`
      # user (1001); started as that user, it skips the step and only checks it can write.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      # Grist exits at startup when its identity provider's discovery document or its home
      # database are not there yet (Accounts migrating, the bootstrap creating the
      # database), and the restarts back off up to five minutes. This waits for both
      # instead, with the image's own Node and PostgreSQL driver and the same settings. It
      # does not lift the dependency on the provider at startup, which is Grist's own
      # (gristlabs/grist-core#1912): see the README, "Grist".
      initContainers:
        - name: wait
          image: {{ printf "%s:%s" $g.image.repository $g.image.tag | quote }}
          imagePullPolicy: {{ $g.image.pullPolicy }}
          command:
            - node
            - -e
            - |
              const { Client } = require("pg");
              const env = process.env;
              async function missing() {
                if (env.GRIST_OIDC_IDP_ISSUER) {
                  const url = env.GRIST_OIDC_IDP_ISSUER.replace(/\/$/, "") + "/.well-known/openid-configuration";
                  try {
                    const response = await fetch(url, { signal: AbortSignal.timeout(5000) });
                    if (!response.ok) { return `${url}: ${response.status}`; }
                  } catch (error) { return `${url}: ${error.cause?.message || error.message}`; }
                }
                if (env.TYPEORM_TYPE === "postgres") {
                  const client = new Client({ host: env.TYPEORM_HOST, port: Number(env.TYPEORM_PORT || 5432),
                    user: env.TYPEORM_USERNAME, password: env.TYPEORM_PASSWORD, database: env.TYPEORM_DATABASE,
                    connectionTimeoutMillis: 5000 });
                  try { await client.connect(); } catch (error) { return `database ${env.TYPEORM_DATABASE}: ${error.message}`; }
                  finally { await client.end().catch(() => {}); }
                }
                return null;
              }
              (async () => {
                for (let reason = await missing(); reason; reason = await missing()) {
                  console.log("waiting for " + reason);
                  await new Promise((resolve) => setTimeout(resolve, 3000));
                }
              })().catch((error) => {
                console.error(error);
                process.exit(1);
              });
          env:
            {{- include "suite-stack.gristEnv" . | nindent 12 }}
          securityContext:
            {{- include "suite-stack.gristSecurityContext" . | nindent 12 }}
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
      containers:
        - name: grist
          image: {{ printf "%s:%s" $g.image.repository $g.image.tag | quote }}
          imagePullPolicy: {{ $g.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8484
          env:
            {{- include "suite-stack.gristEnv" . | nindent 12 }}
          # The first start creates the home database's tables.
          startupProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /status
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          securityContext:
            {{- include "suite-stack.gristSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: persist
              mountPath: /persist
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 384Mi
            limits:
              # The data engine of each open document runs in its own process.
              memory: 2Gi
      volumes:
        - name: persist
          emptyDir:
            sizeLimit: 5Gi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: grist
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "suite-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: grist
spec:
  type: ClusterIP
  selector:
    {{- include "suite-stack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: grist
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if $g.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grist
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "suite-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: grist
  {{- with $g.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $g.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if $g.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ $g.host | quote }}
      secretName: {{ $g.ingress.tls.secretName | default "grist-tls" | quote }}
  {{- end }}
  rules:
    - host: {{ $g.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grist
                port:
                  name: http
{{- end }}
{{- end }}
