# Values for the encryption chart. Every key is validated by values.schema.json: a typo
# in a key name or a wrong type fails `helm template` instead of producing a pod that
# boots without the variable. Values marked "required" fail the render when empty.
#
# The chart deploys the service and nothing it depends on. PostgreSQL, the SMTP relay,
# the OIDC provider and an error collector are external services the operator already
# runs; the chart takes their coordinates and never manages persistent storage.

# Read by a parent chart's dependency condition when this chart is one of its subcharts
# (deploy/helm/suite-stack). The chart itself ignores it.
enabled: true

image:
  repository: lasuite/encryption
  # The application version to run. Required (or a digest): the chart is versioned on
  # its own, by `chart/vX.Y.Z` tags, and has no opinion on which application it runs.
  tag: ''
  # The bytes to run. With both set the reference is "repository:tag@sha256:...", the
  # tag for humans and the digest for the runtime, which refuses anything else. Take
  # the digest from `cosign verify-attestation` (see docker-compose.production.yaml),
  # never from a tag you did not verify.
  digest: ''
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ''
fullnameOverride: ''

replicaCount: 2

# The two public hostnames. Required. TLS is not optional in front of them: the vault
# needs a secure context and the browser reporting endpoint is ignored over plain HTTP.
hosts:
  vault: '' # e.g. data.encryption.example.com
  interface: '' # e.g. encryption.example.com

# Non-secret configuration, mirroring .env.model. Names follow the variables.
config:
  # Product origins allowed to embed the iframes. Required, at least one. They must
  # share one registrable domain (see the README, "Storage partitioning constraint").
  allowedFrameAncestors: []
  oidc:
    issuer: '' # required, https://...
    clientId: '' # required, the interface's confidential client
    # The client's secret: the server exchanges the authorization code with it
    # (see `tokenEndpointAuthMethod`). One of `clientSecret` (inline, written into a
    # Secret the chart owns) or `existingSecret.name`. Required.
    clientSecret: ''
    existingSecret:
      name: ''
      key: OIDC_CLIENT_SECRET
    # How the secret reaches the token endpoint, as the provider registered the client:
    # `client_secret_post` (in the form body) or `client_secret_basic` (HTTP Basic).
    tokenEndpointAuthMethod: client_secret_post
    redirectUri: '' # default: https://<hosts.interface>/auth/callback
    acceptUnverifiedEmail: false
    fallbackToEmailForIdentification: false
    # `openid` alone: the email and names are asked for in userinfo through the `claims`
    # parameter. For a provider that ignores it, grant the scopes
    # here, e.g. `openid email profile`.
    scopes: openid
    # The claims carrying the names, each an ordered list of candidates. The first name
    # is required, plus a last name or a full name (the last name is then the full name
    # minus the first name).
    claims:
      firstName: [given_name]
      lastName: [usual_name, family_name]
      fullName: [name]
    # Step-up (RFC 9470) for sensitive actions (replacing an identity): the ID token
    # must show a second factor, an `acr` among `acrValues` or an `amr` among
    # `amrValues`, from a sign-in younger than `maxAgeSeconds`. The defaults are
    # the eIDAS second-factor levels; both lists empty = a fresh sign-in is enough.
    stepUp:
      acrValues: [eidas0-mfa, eidas1-mfa, eidas2, eidas3]
      amrValues: [mfa, otp, totp, hwk, sc, pop]
      maxAgeSeconds: 300
  mailer:
    smtpHost: '' # required: the emergency-access notifications are a security control
    smtpPort: 25
    secure: false # implicit TLS (465); leave false for STARTTLS on 25/587
    requireTls: true
    # Credentials, either inline (written into a Secret the chart owns) or from an
    # existing Secret. Leave everything empty for an unauthenticated relay.
    user: ''
    password: ''
    existingSecret:
      name: ''
      userKey: MAILER_SMTP_USER
      passwordKey: MAILER_SMTP_PASSWORD
    # Optional second relay, tried when the primary send fails.
    fallback:
      smtpHost: ''
      smtpPort: 25
      secure: false
      requireTls: true
      user: ''
      password: ''
      existingSecret:
        name: ''
        userKey: MAILER_FALLBACK_SMTP_USER
        passwordKey: MAILER_FALLBACK_SMTP_PASSWORD
    senderAddress: '' # e.g. noreply@example.org
  # Where email links send the user (the interface only exists inside a product). Required.
  emailProductUrl: ''
  docsEnabled: true
  # Optional JSON for the brand font (family + woff URLs), see .env.model.
  brandFont: ''
  # Where researchers report a problem with THIS instance, published as
  # /.well-known/security.txt. Empty = the path does not exist.
  securityContactUrl: ''
  # Maintenance escrow (architecture.md, Appendix E): one public key per organization,
  # as the maintenance tool generates it, with the email domains whose owners'
  # documents it escrows (longest matching domain wins, "*" for every other email).
  # Empty = no escrow copy is produced. Public keys, so plain values; each secret key
  # is a 24-word phrase that never reaches the cluster.
  #   maintenanceEscrowKeys:
  #     - domains: [agriculture.gouv.fr]
  #       publicKey: AUJC...
  #     - domains: ['*']
  #       publicKey: AUJD...
  maintenanceEscrowKeys: []
  retention:
    # Days a dormant vault (replaced by a start-over, or left by leaving encryption)
    # stays restorable before its content is deleted, with emails 30 and 7 days
    # before. 0 = never delete; otherwise at least 180.
    vaultPurgeAfterDays: 730
    # Days without use after which a browser forgets its copy of the vault and must
    # be enrolled again. 0 = never; otherwise at least 30.
    deviceInactivityDays: 365

database:
  # The runtime role's connection string (rows only, see deploy/postgres/). One of
  # `url` (inline, written into a Secret the chart owns) or `existingSecret.name`.
  url: ''
  existingSecret:
    name: ''
    key: DATABASE_URL
  migration:
    # A Job run as a Helm pre-install/pre-upgrade hook (Argo CD maps it to PreSync):
    # once per release, never per pod, and a failed migration stops the rollout.
    enabled: true
    # The migrator role's connection string. Same shape as above.
    url: ''
    existingSecret:
      name: ''
      key: DATABASE_URL
    # Its own account, never the server's: the migrator is the one identity allowed to
    # alter the schema, so anything granted through the account (a cloud IAM binding for
    # database authentication, for instance) must not reach the long-lived pods.
    serviceAccount:
      create: true
      name: ''
      annotations: {}
    backoffLimit: 1
    activeDeadlineSeconds: 600
    annotations: {}
    resources:
      requests:
        cpu: 25m
        memory: 256Mi
      limits:
        memory: 512Mi

sentry:
  # Error reporting to any Sentry-compatible collector (Sentry, GlitchTip). Disabled,
  # nothing is sent and nothing else changes. See "Error reporting" in the README.
  enabled: false
  dsn: ''
  existingSecret:
    name: ''
    key: SENTRY_DSN
  environment: ''
  # Empty = the commit the image was built from.
  release: ''

# Raw Kubernetes `env` entries appended after the chart's own (a value, a
# configMapKeyRef, a secretKeyRef, a fieldRef...). `extraEnvFrom` are `envFrom`
# entries (a whole Secret or ConfigMap). Both are for what the chart has no key for,
# and override nothing: Kubernetes keeps the FIRST occurrence of a variable name.
extraEnv: []
extraEnvFrom: []

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: ''
  annotations: {}
  # One rule per host, both to the same Service (the server routes on the Host header).
  tls:
    enabled: true
    # Empty = "<fullname>-tls". With cert-manager, add its annotation above and it
    # creates this Secret for both hosts.
    secretName: ''

# Mirrors docker-compose.production.yaml: no shell, no root, nothing writable but /tmp.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# The only writable path. Memory-backed and bounded, like the compose tmpfs.
tmpVolume:
  sizeLimit: 64Mi

resources:
  requests:
    cpu: 25m
    memory: 384Mi
  limits:
    # Node sizes its heap from this limit (--max-old-space-size-percentage in the image).
    memory: 1Gi

# The three probes call three levels of the server's own check: /health/startup (serves its
# pages, its API, and reaches a migrated database), /health/ready (the same without the
# database) and /health (the process answers).
probes:
  startup:
    periodSeconds: 2
    # The first database round trip opens a TLS connection: more than the default second.
    timeoutSeconds: 4
    failureThreshold: 30
  readiness:
    periodSeconds: 10
    timeoutSeconds: 2
  liveness:
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

terminationGracePeriodSeconds: 30

podDisruptionBudget:
  # Rendered only when replicaCount > 1, since a budget on a single replica blocks node drains.
  enabled: true
  minAvailable: 1

serviceAccount:
  create: true
  name: ''
  annotations: {}

networkPolicy:
  # Off by default because the egress destinations (database, relay, OIDC provider,
  # collector) are only known to the operator. Enabled, the pods accept traffic on
  # the app port from `ingress.from` (empty = anywhere) and may only reach DNS plus
  # the `egress` rules given here.
  enabled: false
  ingress:
    from: []
  egress: []

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway

priorityClassName: ''
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}
deploymentAnnotations: {}
