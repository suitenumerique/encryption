name: OpenSSF Scorecard

on:
  push:
    branches:
      - main
  schedule:
    - cron: '30 4 * * 1' # weekly, because checks like `Maintained` or known vulnerabilities move without any commit

permissions: # Default permissions
  contents: read

jobs:
  analysis:
    name: Analysis
    if: ${{ !github.event.act }} # reads the real repository through the GitHub API, which "act" has no token for
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # to raise each finding as a code scanning alert, which is what notifies us
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false

      - name: Analyze the repository
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false # do not feed https://scorecard.dev log

      - name: Report the findings
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: results.sarif
