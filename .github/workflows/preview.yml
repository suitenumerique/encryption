name: Preview environment

# One ephemeral environment per pull request carrying the `preview` label. The environment
# itself is not created here: an Argo CD ApplicationSet in the deployment repository
# (deploy/argocd/applicationset-preview.example.yaml) lists the labelled pull requests
# and renders deploy/helmfile/preview at each one's own commit, then removes it when the
# pull request closes or loses the label. This repository only has to say where the
# environment is, and nudge Argo CD to look now rather than at its next poll.
#
# The product images the environment runs are set in the deployment repository, next to
# the ApplicationSet (`pr-<number>` tags of a labelled upstream pull request, or a build
# pushed by hand, see deploy/helm/suite-stack/README.md, "Images"). The encryption image
# is the helmfile's default, the `main` tag: the CI publishes no image for a pull request.

on:
  pull_request:
    types: [labeled, opened, synchronize]

permissions:
  contents: read

jobs:
  comment:
    name: Say where it is
    if: contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          comment-tag: preview-url
          message: |
            :rocket: Preview of this pull request, full stack:
            - Docs: https://${{ github.event.pull_request.number }}-docs.${{ vars.PREVIEW_DOMAIN }}/
            - Drive: https://${{ github.event.pull_request.number }}-drive.${{ vars.PREVIEW_DOMAIN }}/
            - Mailbox: https://${{ github.event.pull_request.number }}-mail.${{ vars.PREVIEW_DOMAIN }}/

            Accounts: `alice.martin` / `alice.martin`, `bob.dupont` / `bob.dupont` (see `bootstrap.keycloak.users`), or create your own on the sign-in page (Register).
            Everything in this environment is public: put nothing real in it.
            The environment is destroyed when this pull request is closed or loses the `preview` label.

  notify-argocd:
    name: Notify Argo CD
    if: contains(github.event.pull_request.labels.*.name, 'preview') && vars.ARGOCD_PREPROD_WEBHOOK_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: numerique-gouv/action-argocd-webhook-notification@cac2ee67896eb13e84e804f60c4271370424eaa8 # main
        with:
          deployment_repo_path: ${{ secrets.DEPLOYMENT_REPO_URL }}
          argocd_webhook_secret: ${{ secrets.ARGOCD_PREPROD_WEBHOOK_SECRET }}
          argocd_url: ${{ vars.ARGOCD_PREPROD_WEBHOOK_URL }}
