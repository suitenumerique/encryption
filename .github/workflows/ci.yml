name: Continuous Integration
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
env:
  APP_NAME: encryption
  CONTAINER_REGISTRY: docker.io
  CONTAINER_IMAGE: lasuite/encryption
  NODE_OPTIONS: --max_old_space_size=4096
  NODE_VERSION: 24.14.0
  PLAYWRIGHT_BROWSERS_CACHE_FOLDER_SUFFIX: .cache/ms-playwright
concurrency:
  # Prevent parallel builds of the same branch
  group: cicd-${{ github.ref }}
  cancel-in-progress: false
jobs:
  requirements:
    name: Continuous Integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Export npm store directory as an environment variable
        shell: bash
        run: |
          echo "STORE_PATH=$(npm config get cache)" >> $GITHUB_ENV

      - uses: actions/cache@v3
        name: Setup npm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-npm-store-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-store-

      - name: Get number of CPU cores for the following test steps
        uses: SimenB/github-actions-cpu-cores@v2
        id: cpu-cores

      - name: Install dependencies
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.STORE_PATH }}/${{ env.PLAYWRIGHT_BROWSERS_CACHE_FOLDER_SUFFIX }}
        run: npm install

      - name: Prepare linting
        run: npm run lint:prepare

      - name: Check the generated API client is synchronized with the routes
        run: |
          npm run api:schema:sync
          git diff --exit-code -- openapi.json src/ui/api/generated \
            || (echo "::error::openapi.json / src/ui/api/generated are stale. Run 'npm run api:schema:sync' and commit the result." && exit 1)

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test unit
        run: npm run test:unit -- --max-workers ${{ steps.cpu-cores.outputs.count }}

      - name: Install `Xvfb` and others to run browsers for end-to-end testing in local CI/CD simulations (https://github.com/nektos/act/issues/1300#issuecomment-1387344639)
        if: ${{ env.ACT }}
        run: sudo apt-get update && sudo apt-get install -y xvfb && npx playwright install-deps chromium

      - name: Test end-to-end
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ env.STORE_PATH }}/${{ env.PLAYWRIGHT_BROWSERS_CACHE_FOLDER_SUFFIX }}
          JEST_MAX_WORKERS: ${{ steps.cpu-cores.outputs.count }}
        run: npm run test:e2e:headless

      # Consider building without Docker to ensure it works in case it has not to be published (pull requests...)
      - name: Build
        if: ${{ github.event.act || (github.ref_name != 'main' && github.ref_type != 'tag') }}
        run: npm run build

      # Otherwise make a build to be published
      - name: Set up Docker buildx
        if: ${{ !github.event.act && (github.ref_name == 'main' || github.ref_type == 'tag') }}
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: ${{ !github.event.act && (github.ref_name == 'main' || github.ref_type == 'tag') }}
        uses: docker/login-action@v2
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
          password: ${{ secrets.CONTAINER_REGISTRY_TOKEN }}

      - name: Compute Docker image tag
        if: ${{ !github.event.act && (github.ref_name == 'main' || github.ref_type == 'tag') }}
        id: docker-meta
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS="${CONTAINER_IMAGE}:${VERSION},${CONTAINER_IMAGE}:latest"
          else
            TAGS="${CONTAINER_IMAGE}:main"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT

      - name: Build and push the application Docker image
        if: ${{ !github.event.act && (github.ref_name == 'main' || github.ref_type == 'tag') }}
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      #
      # Deployment must be handled outside this repository, either by using GitHub hooks, regular checks, or by manually deploying
      #
