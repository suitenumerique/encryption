<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Empty data URI: browsers auto-request /favicon.ico on every top-level
         page, which the demo does not serve. Declaring one suppresses the
         request entirely rather than adding an asset nobody looks at. -->
    <link rel="icon" href="data:," />
    <title>Encryption Demo - Fake Product</title>
    <style>
      html,
      body {
        overflow: auto !important;
        min-height: 100%;
      }

      /* The modal hosting the encryption interface is the design system's
         350px "small" modal; Cunningham's small is 300px. */
      .c__modal--small:has(.demo-encryption-host) {
        width: 350px;
      }

      /* The interface pads its own screens: the modal gives its iframe the bare box. */
      .c__modal:has(.demo-encryption-host) .c__modal__scroller {
        padding: 0;
      }

      /* The design system's close control is a zero-height sticky spot inside the
         scroller: while the modal does not scroll it sits in the top padding, and once
         it scrolls it pins elsewhere, so the cross jumps and the content shows through
         around it. Anchoring it to the modal box itself keeps it in the same corner
         in every case, and a halo in the modal's colour masks what scrolls under it. */
      .c__modal:has(.demo-encryption-host) .c__modal__close {
        position: absolute;
        top: 0.4rem;
        right: 0.4rem;
        height: auto;
        z-index: 1;
      }

      .c__modal:has(.demo-encryption-host) .c__modal__close .c__button {
        top: 0;
        right: 0;
        background: var(--c--components--modal--background-color);
        box-shadow: 0 0 0 4px var(--c--components--modal--background-color);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
