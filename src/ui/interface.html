<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Encryption Interface</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }

      .access-error {
        display: none;
        max-width: 480px;
        margin: 80px auto;
        padding: 24px;
        font-family: system-ui, sans-serif;
        text-align: center;
        color: #ce0500;
        border: 2px solid #ce0500;
        border-radius: 8px;
        background: #ffe9e6;
      }
      .access-error h1 {
        font-size: 18px;
        margin: 0 0 12px;
      }
      .access-error p {
        font-size: 14px;
        margin: 0;
        color: #333;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="access-error" id="access-error">
      <h1>Unauthorized access</h1>
      <p>
        This page is a technical service that should only be loaded within an authorized application. If you see this message, something is wrong.
        Please close this tab immediately.
      </p>
    </div>
    <div id="root"></div>
    <script>
      // Auth routes (/login, /auth/callback) are opened in a new tab, not in an iframe.
      var isAuthRoute = window.location.pathname === '/login' || window.location.pathname === '/auth/callback';
      if (window.self === window.top && !isAuthRoute) {
        document.getElementById('access-error').style.display = 'block';
        document.getElementById('root').style.display = 'none';
      }
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
