#
# [IMPORTANT] `container_name` properties are prefixed by the project name to avoid conflicting with other project volumes
#

services:
  postgres:
    container_name: encryption_postgres_container_${DOCKER_COMPOSE_CONTAINER_NAME_SUFFIX:-default}
    image: postgres:16.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
    ports:
      - '${DOCKER_COMPOSE_POSTGRES_PORT_BINDING:-7205:5432}'
    networks:
      - encryption
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 1s
      timeout: 3s
      retries: 10

  keycloak-db:
    container_name: encryption_keycloak_db_container_${DOCKER_COMPOSE_CONTAINER_NAME_SUFFIX:-default}
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_DB: keycloak
    volumes:
      - keycloak-db:/var/lib/postgresql/data
    ports:
      - '7206:5432'
    networks:
      - encryption
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 1s
      timeout: 3s
      retries: 10

  keycloak:
    container_name: encryption_keycloak_container_${DOCKER_COMPOSE_CONTAINER_NAME_SUFFIX:-default}
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME_STRICT: 'false'
      KC_HOSTNAME_STRICT_HTTPS: 'false'
      KC_HTTP_ENABLED: 'true'
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 7203
      KC_HEALTH_ENABLED: 'true'
    volumes:
      - ./config/development/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    ports:
      - '7203:8080'
    networks:
      - encryption
    depends_on:
      keycloak-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'exec 3<>/dev/tcp/localhost/9000; echo -e "GET /health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep "HTTP/1.1 200 OK" <&3',
        ]
      start_period: 30s
      interval: 2s
      timeout: 2s
      retries: 15

  maildev:
    container_name: encryption_maildev_container_${DOCKER_COMPOSE_CONTAINER_NAME_SUFFIX:-default}
    image: maildev/maildev:2.2.1
    ports:
      - '7207:1080'
      - '7208:1025'
    networks:
      - encryption
    restart: unless-stopped
    healthcheck:
      test: ['CMD', '/scripts/docker-healthcheck.sh']
      interval: 1s
      timeout: 3s
      retries: 5

networks:
  encryption:
    driver: bridge

volumes:
  postgres:
  keycloak-db:
